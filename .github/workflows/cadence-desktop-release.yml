# ─────────────────────────────────────────────────────────────────────────────
# Cadence Desktop Release
#
# Builds the desktop installers and publishes them, with the updater manifest
# (latest.json), as a GitHub Release whenever a `v*` tag is pushed
# (`pnpm release` creates it), or on manual dispatch. The version comes from the
# root package.json at that tag. Installed apps update from
# releases/latest/download/latest.json, so tag pushes publish immediately
# (not as drafts); tags with a `-` (v1.0.0-beta.1) become pre-releases, which
# the updater ignores.
#
# Platform matrix
#   Windows — windows-latest (NSIS installer)
#   Linux and macOS are not built yet.
#
# Secrets
#   TAURI_SIGNING_PRIVATE_KEY          — updater private key (required)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — its password, if it has one
#   WINDOWS_CERTIFICATE                — optional: base64 PFX for Authenticode;
#   WINDOWS_CERTIFICATE_PASSWORD         without it the installer is unsigned
#   WINDOWS_CERTIFICATE_THUMBPRINT       (SmartScreen warns on first install)
# ─────────────────────────────────────────────────────────────────────────────

name: Cadence Desktop Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or publish (e.g. v1.0.0)"
        required: true
        type: string
      release_draft:
        description: "Publish as a draft release"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: cadence-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_RUNTIME_TARGET: desktop
  VITE_API_BASE_URL: https://api.cadenceapp.cloud
  VITE_NEON_AUTH_URL: https://ep-silent-grass-adfk8oeg.neonauth.c-2.us-east-1.aws.neon.tech/neondb/auth

jobs:
  release:
    name: Release (${{ matrix.cache_key }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: ""
            cache_key: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release metadata
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag_name }}"         >> "$GITHUB_ENV"
            echo "RELEASE_DRAFT=${{ inputs.release_draft }}"  >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=${{ inputs.prerelease }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_DRAFT=false"            >> "$GITHUB_ENV"
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              echo "RELEASE_PRERELEASE=true"  >> "$GITHUB_ENV"
            else
              echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          fi

      # This version's CHANGELOG.md section becomes the GitHub release body and the
      # update notes in latest.json. "### " is stripped: the app shows it as plain text.
      - name: Read release notes from CHANGELOG.md
        shell: bash
        run: |
          {
            echo "RELEASE_NOTES<<CADENCE_RELEASE_NOTES_END"
            tr -d '\r' < CHANGELOG.md | awk -v heading="## [${RELEASE_TAG#v}]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              !found { next }
              $0 == "" { blank = printed; next }
              { if (blank) print ""; blank = 0; printed = 1; sub(/^### /, ""); print }'
            echo "CADENCE_RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync desktop version from tag
        run: pnpm --filter @cadence/desktop sync-version

      - name: Validate required signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Missing required secret TAURI_SIGNING_PRIVATE_KEY (updater signing key)." >&2
            exit 1
          fi

      - name: Check for Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ -n "${WINDOWS_CERTIFICATE}" ]; then
            echo "WINDOWS_SIGN=true" >> "$GITHUB_ENV"
          else
            echo "::warning::WINDOWS_CERTIFICATE not set; the installer will be unsigned."
          fi

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGN == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cadence-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null

      - name: Write Windows signing configuration
        if: runner.os == 'Windows' && env.WINDOWS_SIGN == 'true'
        shell: bash
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_DIGEST_ALGORITHM: ${{ vars.WINDOWS_DIGEST_ALGORITHM }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          digest="${WINDOWS_DIGEST_ALGORITHM:-sha256}"
          timestamp_url="${WINDOWS_TIMESTAMP_URL:-http://timestamp.digicert.com}"
          cat > apps/desktop/src-tauri/tauri.windows.conf.json <<EOF
          {
            "bundle": {
              "windows": {
                "certificateThumbprint": "${WINDOWS_CERTIFICATE_THUMBPRINT}",
                "digestAlgorithm": "${digest}",
                "timestampUrl": "${timestamp_url}"
              }
            }
          }
          EOF

      - name: Build and publish release artifacts
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Cadence Desktop ${{ env.RELEASE_TAG }}
          releaseDraft: ${{ env.RELEASE_DRAFT }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseCommitish: ${{ github.sha }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          generateReleaseNotes: true
          retryAttempts: 2
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
