# ─────────────────────────────────────────────────────────────────────────────
# Cadence Landing Checks
#
# Runs on every PR and push to main that touches the landing site. Validates
# types, a full production build, and a Wrangler deploy dry-run.
#
# Jobs
#   typecheck       — React Router typegen + TypeScript compilation check
#   build           — Full production build (react-router build)
#   deploy-dry-run  — Wrangler deploy dry-run (catches Worker / config errors)
#   gate            — Required status check; fails if any job above fails
# ─────────────────────────────────────────────────────────────────────────────

name: Cadence Landing Checks

on:
  pull_request:
    paths:
      - apps/landing/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/cadence-landing.yml
  push:
    branches:
      - main
    paths:
      - apps/landing/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - .github/workflows/cadence-landing.yml

permissions:
  contents: read

concurrency:
  group: cadence-landing-${{ github.ref }}
  cancel-in-progress: true

env:
  # React Router 8 requires Node >= 22.22.
  NODE_VERSION: "22"

jobs:
  # ── Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm --filter @cadence/landing typecheck

  # ── Build ────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs:
      - typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm --filter @cadence/landing build

  # ── Deploy Dry-Run ───────────────────────────────────────────────────────
  deploy-dry-run:
    name: Deploy Dry-Run
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm --filter @cadence/landing build

      # The Cloudflare Vite plugin writes the deployable config into the build output.
      - name: Wrangler deploy dry-run
        run: pnpm --filter @cadence/landing exec wrangler deploy --dry-run

  # ── Gate ─────────────────────────────────────────────────────────────────
  gate:
    name: Landing Gate
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - build
      - deploy-dry-run
    if: always()
    steps:
      - name: Evaluate landing gate
        run: |
          failed=()
          [[ "${{ needs.typecheck.result }}"      == "success" ]] || failed+=("typecheck")
          [[ "${{ needs.build.result }}"          == "success" ]] || failed+=("build")
          [[ "${{ needs.deploy-dry-run.result }}" == "success" ]] || failed+=("deploy-dry-run")

          if (( ${#failed[@]} )); then
            printf '::error::Landing gate failed — check these jobs: %s\n' "${failed[*]}"
            exit 1
          fi
          echo "All landing checks passed."
