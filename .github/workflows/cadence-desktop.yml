# Cadence Desktop — Rust lint + a debug build per OS. The smoke suite builds the
# debug binary itself, so Linux/Windows build via e2e; macOS (no WebDriver) just builds.
# Frontend-only changes don't trigger this; run it by hand (workflow_dispatch) when needed.

name: Cadence Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/**
      - pnpm-lock.yaml
      - .github/workflows/cadence-desktop.yml
  push:
    branches:
      - main
    paths:
      - apps/desktop/**
      - pnpm-lock.yaml
      - .github/workflows/cadence-desktop.yml

permissions:
  contents: read

concurrency:
  group: cadence-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_RUNTIME_TARGET: desktop
  VITE_API_BASE_URL: https://api.cadenceapp.cloud
  VITE_NEON_AUTH_URL: https://ep-silent-grass-adfk8oeg.neonauth.c-2.us-east-1.aws.neon.tech/neondb/auth

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Caches target/ and ~/.cargo/bin (so tauri-driver compiles once).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev patchelf webkit2gtk-driver xvfb

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rust lint (fmt + clippy)
        if: runner.os == 'Linux'
        run: pnpm --filter @cadence/desktop typecheck

      - name: Install tauri-driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --locked

      - name: Build + smoke test
        if: runner.os == 'Linux'
        env:
          TAURI_WEBVIEW_AUTOMATION: "true"
        run: xvfb-run -a pnpm --filter @cadence/desktop e2e:smoke

      - name: Build + smoke test
        if: runner.os == 'Windows'
        run: pnpm --filter @cadence/desktop e2e:smoke

      - name: Build
        if: runner.os == 'macOS'
        run: pnpm --filter @cadence/desktop build:debug
