[package]
name = "cadence-desktop"
version = "0.25.4"
description = "Cadence desktop shell"
authors = ["Cadence"]
license = "AGPL-3.0-only"
repository = "https://github.com/toricodesthings/Cadence"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cadence_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cadence-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-deep-link = "2.4.7"
# unsafe-headers: Neon Auth only trusts the web app's Origin, so the frontend sets it (patch-desktop-fetch.ts).
tauri-plugin-http = { version = "2.5.7", features = ["unsafe-headers"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-store = "2.4.2"

# Desktop-only plugins (no Android/iOS implementation); gated in lib.rs with #[cfg(desktop)].
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2.10.0"
tauri-plugin-oauth = "2"
tauri-plugin-keyring = "0.1.0"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
tauri-plugin-global-shortcut = "2.3.1"
