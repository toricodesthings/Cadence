<g id="lg-petal-3" class="lg-part lg-petal" style="transform-origin:142.7px 286px"><path fill="url(#lg-dusk)" d="M142.7,286C124.6,278.8 116.9,255 127.3,238.5C145.4,245.7 153.1,269.5 142.7,286Z"/></g>
<g id="lg-petal-4" class="lg-part lg-petal" style="transform-origin:174.7px 211.9px"><path d="M174.7,211.9C179.4,199.6 192.7,197.2 200.9,204.8L200.9,204.8L198.6,207.7L201.7,209.7C196.6,219.6 183.3,221.9 174.7,211.9Z"/><path d="M174.7,211.9C187.9,212.6 194.2,224.5 189.6,234.6L189.6,234.6L186.1,233.4L185.2,236.9C174.2,235.1 167.9,223.2 174.7,211.9Z"/><path d="M174.7,211.9C178.2,224.7 168.8,234.4 157.7,233.1L157.7,233.1L157.8,229.4L154.1,229.6C152.5,218.6 161.9,208.9 174.7,211.9Z"/><path d="M174.7,211.9C163.7,219.2 151.5,213.2 149.3,202.3L149.3,202.3L152.9,201.3L151.5,197.8C161.5,192.9 173.6,198.8 174.7,211.9Z"/><path d="M174.7,211.9C164.4,203.7 166.3,190.3 176,184.8L176,184.8L178.1,187.9L180.9,185.5C188.7,193.5 186.9,206.8 174.7,211.9Z"/><circle cx="174.7" cy="211.9" r="4.6" fill="#ffc86b"/></g>
