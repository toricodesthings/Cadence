<mask id="lg-under-swash" maskUnits="userSpaceOnUse" x="0" y="0" width="850" height="850"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><use href="#lg-orbit-inner" stroke-width="28"/></g></mask>
<mask id="lg-under-orbit" maskUnits="userSpaceOnUse" x="0" y="0" width="850" height="850"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><use href="#lg-horizon-tail" stroke-width="28"/><use href="#lg-swash" stroke-width="28"/></g></mask>
<mask id="lg-under-check" maskUnits="userSpaceOnUse" x="0" y="0" width="850" height="850"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><use href="#lg-orbit" stroke-width="28"/><use href="#lg-swash" stroke-width="28"/></g></mask>
<mask id="lg-under-horizon" maskUnits="userSpaceOnUse" x="0" y="0" width="850" height="850"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><use href="#lg-orbit" stroke-width="28"/><use href="#lg-check" stroke-width="32"/></g></mask>
<linearGradient id="lg-sakura" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f08ca6"/><stop offset="1" stop-color="#ffd3d8"/></linearGradient>
</defs>
<g id="lg-logo" transform="translate(-12 -6)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#lg-glow)">
<use href="#lg-horizon-tail" stroke="url(#lg-dusk)" stroke-width="28"/>
<use href="#lg-orbit-inner" stroke="url(#lg-dusk)" stroke-width="28"/>
<g mask="url(#lg-under-swash)"><use href="#lg-swash" stroke="#3a1030" stroke-opacity=".55" stroke-width="40" filter="url(#lg-soft)"/></g>
<use href="#lg-swash" stroke="url(#lg-dusk)" stroke-width="28"/>
<g mask="url(#lg-under-orbit)"><use href="#lg-orbit" stroke="#3a1030" stroke-opacity=".55" stroke-width="40" filter="url(#lg-soft)"/></g>
<use href="#lg-orbit" stroke="url(#lg-dusk)" stroke-width="28"/>
<g mask="url(#lg-under-check)"><use href="#lg-check" stroke="#3a1030" stroke-opacity=".55" stroke-width="44" filter="url(#lg-soft)"/></g>
<use href="#lg-check" stroke="url(#lg-lantern)" stroke-width="32"/>
<g mask="url(#lg-under-horizon)"><use href="#lg-horizon" stroke="#3a1030" stroke-opacity=".55" stroke-width="40" filter="url(#lg-soft)"/></g>
<use href="#lg-horizon" stroke="url(#lg-dusk)" stroke-width="28"/>
<use href="#lg-dash-1" stroke="url(#lg-dusk)" stroke-width="28"/>
<use href="#lg-dash-2" stroke="url(#lg-dusk)" stroke-width="28"/>
<g id="lg-petals" fill="url(#lg-sakura)" stroke="none">
